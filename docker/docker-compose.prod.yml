services:
  frontend:
    image: bin05/frontend:latest 
    container_name: production_frontend
    restart: always
    ports:
      - "3000:80" 
    networks:
      - app_net
      - monitoring

  backend:
    image: bin05/backend:latest
    container_name: production_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    depends_on:
      - mongodb
      - minio
    networks:
      - app_net
      - monitoring

  mongodb:
    image: mongo:6.0
    container_name: production_mongodb
    restart: always
    volumes:
      - mongo_prod_data:/data/db
    networks:
      - app_net

  minio:
    image: minio/minio:latest
    container_name: production_minio
    restart: always
    volumes:
      - minio_prod_data:/data
    command: server /data --console-address ":9001"
    networks:
      - app_net
      - monitoring

volumes:
  mongo_prod_data:
  minio_prod_data:

networks:
  app_net:
    driver: bridge
  monitoring:
    external: true