[project]
name = "ban-do-sv-sp-api"
version = "1.0.0"
description = "API hệ thống bản đồ sinh viên sư phạm"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests with mocked MongoDB (no real database).",
    "integration: API tests against real MongoDB (requires running instance).",
]
